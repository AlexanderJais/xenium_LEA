[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenium-lea"
version = "0.1.0"
description = "Read-only audit of a multi-run Xenium study: panel harmonisation, segmentation kit, per-run QC, and whether batch effects are separable from the biology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Jais" }]
keywords = ["xenium", "spatial-transcriptomics", "qc", "batch-effects", "study-design"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Deliberately light. The whole Tier-0 audit (inventory, panel, segmentation,
# QC, separability verdict) runs on these — no scanpy, no anndata, so the audit
# works even where the analysis environment does not.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xenium-lea = "xenium_lea.cli:main"

[project.urls]
Homepage = "https://github.com/AlexanderJais/xenium_LEA"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
